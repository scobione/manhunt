name: Validate MANHUNT
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build independent admin portal
        run: npm --prefix admin ci && npm --prefix admin run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix admin audit --omit=dev --audit-level=high
      - name: Install Chromium for Playwright
        # ubuntu-latest already supplies Chromium's shared libraries. Avoid
        # unrelated apt upgrades, which can stall on a slow Ubuntu mirror.
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: Run isolated browser multiplayer tests
        run: |
          export PLAYWRIGHT_CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          npm run test:e2e
          npm run test:edge:e2e
          npx playwright test -c playwright.admin.config.ts
      - name: Check the production frontend bundle
        run: |
          export PLAYWRIGHT_CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          npm run test:public
          npx playwright test -c playwright.redirect.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            test-results-edge/
            test-results-admin/
            test-results-public/
            test-results-redirect/
          retention-days: 7

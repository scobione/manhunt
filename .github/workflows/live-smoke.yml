name: Published frontend smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/live-smoke.yml, package.json]
permissions:
  contents: read
concurrency:
  group: live-frontend-smoke
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        # Use the runner's existing system libraries; download the locked
        # Playwright browser without upgrading packages through apt mirrors.
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: Open the published frontend in Chromium
        env:
          PUBLIC_URL: https://manhunt-fieldgame.scobione.chatgpt.site
        run: |
          export PLAYWRIGHT_CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          npm run test:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-frontend-screenshots
          path: test-results-public/
          retention-days: 7
